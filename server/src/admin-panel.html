<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bamboo Admin Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0f;
    color: #e2e8f0;
    min-height: 100vh;
  }
  /* ===== Login ===== */
  #login-overlay {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #13131a 0%, #0a0a0f 100%);
  }
  #login-overlay.hidden { display: none; }
  .login-card {
    background: #13131f; border: 1px solid #1e293b; border-radius: 20px;
    padding: 40px; width: 380px; max-width: 90vw;
    box-shadow: 0 25px 80px rgba(0,0,0,0.6);
  }
  .login-card .logo {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, #10b981, #059669);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 20px;
  }
  .login-card h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px; }
  .login-card p { font-size: 13px; color: #64748b; margin-bottom: 24px; }
  .login-card label { font-size: 12px; font-weight: 600; color: #94a3b8; display: block; margin-bottom: 6px; }
  .login-card input {
    width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid #1e293b;
    background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none;
    transition: border-color 0.2s; margin-bottom: 14px;
  }
  .login-card input:focus { border-color: #10b981; }
  .login-card .error { color: #ef4444; font-size: 12px; margin-top: -8px; margin-bottom: 12px; display: none; }
  .login-card button {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #10b981, #059669); color: white;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity 0.2s;
  }
  .login-card button:hover { opacity: 0.9; }
  .login-card button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== Layout ===== */
  #app { display: none; }
  #app.active { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px; background: #0f0f18; border-right: 1px solid #1a1a2e;
    padding: 20px 0; flex-shrink: 0; display: flex; flex-direction: column;
  }
  .sidebar .brand {
    padding: 0 20px 20px; border-bottom: 1px solid #1a1a2e; margin-bottom: 12px;
    display: flex; align-items: center; gap: 12px;
  }
  .sidebar .brand .icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #10b981, #059669);
    display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .sidebar .brand h2 { font-size: 15px; font-weight: 800; }
  .sidebar .brand span { font-size: 10px; color: #64748b; font-weight: 500; }
  .sidebar nav { flex: 1; overflow-y: auto; }
  .sidebar nav button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 20px; border: none; background: transparent; color: #64748b;
    font-size: 13px; font-weight: 600; cursor: pointer; text-align: left;
    transition: all 0.15s; border-right: 2px solid transparent;
  }
  .sidebar nav button:hover { color: #e2e8f0; background: rgba(255,255,255,0.03); }
  .sidebar nav button.active { color: #10b981; background: rgba(16,185,129,0.08); border-right-color: #10b981; }
  .sidebar .user-info {
    padding: 16px 20px; border-top: 1px solid #1a1a2e; font-size: 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar .user-info .name { color: #94a3b8; }
  .sidebar .user-info .logout {
    color: #ef4444; cursor: pointer; font-weight: 600; font-size: 11px;
    padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(239,68,68,0.2);
    background: rgba(239,68,68,0.08); transition: all 0.15s;
  }
  .sidebar .user-info .logout:hover { background: rgba(239,68,68,0.2); }

  .main { flex: 1; padding: 24px 32px; overflow-y: auto; max-height: 100vh; }

  /* ===== Components ===== */
  .page-header { margin-bottom: 24px; }
  .page-header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
  .page-header p { font-size: 13px; color: #64748b; margin-top: 4px; }

  /* Stats Cards */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card {
    background: #11111e; border: 1px solid #1e293b; border-radius: 14px;
    padding: 16px 20px;
  }
  .stat-card .stat-value { font-size: 28px; font-weight: 800; }
  .stat-card .stat-label { font-size: 12px; color: #64748b; margin-top: 2px; }

  /* Tables / Cards */
  .card {
    background: #11111e; border: 1px solid #1e293b; border-radius: 14px;
    overflow: hidden; margin-bottom: 16px;
  }
  .card-header {
    padding: 14px 20px; border-bottom: 1px solid #1a1a2e;
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-header h3 { font-size: 14px; font-weight: 700; }
  .card-header .badge {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px;
    background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid rgba(16,185,129,0.2);
  }
  .card-body { padding: 16px 20px; overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 700;
    color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;
    border-bottom: 1px solid #1e293b;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid #16162a; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody tr:last-child td { border-bottom: none; }

  .badge-type {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
  }
  .badge-type.cape { background: rgba(99,102,241,0.1); color: #818cf8; border: 1px solid rgba(99,102,241,0.2); }
  .badge-type.aura { background: rgba(168,85,247,0.1); color: #c084fc; border: 1px solid rgba(168,85,247,0.2); }
  .badge-type.hat { background: rgba(245,158,11,0.1); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
  .badge-type.ear { background: rgba(236,72,153,0.1); color: #f472b6; border: 1px solid rgba(236,72,153,0.2); }
  .badge-type.wings { background: rgba(14,165,233,0.1); color: #38bdf8; border: 1px solid rgba(14,165,233,0.2); }
  .badge-type.rank { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
  .badge-type.other { background: rgba(148,163,184,0.1); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }

  .badge-rarity {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
  }
  .badge-rarity.common { background: rgba(148,163,184,0.1); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }
  .badge-rarity.rare { background: rgba(96,165,250,0.1); color: #93c5fd; border: 1px solid rgba(96,165,250,0.2); }
  .badge-rarity.epic { background: rgba(168,85,247,0.1); color: #c084fc; border: 1px solid rgba(168,85,247,0.2); }
  .badge-rarity.legendary { background: rgba(251,191,36,0.1); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
  .badge-rarity.mythic { background: rgba(251,146,60,0.1); color: #fb923c; border: 1px solid rgba(251,146,60,0.2); }

  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
  }
  .status-dot.active { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.4); }
  .status-dot.inactive { background: #64748b; }

  .btn {
    padding: 6px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-primary { background: #10b981; color: white; }
  .btn-primary:hover { background: #059669; }
  .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
  .btn-ghost { background: transparent; color: #64748b; border: 1px solid #1e293b; }
  .btn-ghost:hover { background: rgba(255,255,255,0.05); color: #e2e8f0; }
  .btn-danger { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
  .btn-danger:hover { background: rgba(239,68,68,0.2); }

  .empty-state {
    text-align: center; padding: 40px 20px; color: #64748b;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; }
  .loading { text-align: center; padding: 40px; color: #64748b; }
  .spinner {
    display: inline-block; width: 20px; height: 20px; border: 2px solid #1e293b;
    border-top-color: #10b981; border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 10000;
    padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600;
    display: none; align-items: center; gap: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .toast.show { display: flex; }
  .toast.success { background: #065f46; border: 1px solid #10b981; color: #a7f3d0; }
  .toast.error { background: #7f1d1d; border: 1px solid #ef4444; color: #fca5a5; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 9998;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #13131f; border: 1px solid #1e293b; border-radius: 20px;
    padding: 28px; width: 520px; max-width: 90vw; max-height: 85vh; overflow-y: auto;
  }
  .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .modal .sub { font-size: 12px; color: #64748b; margin-bottom: 20px; }
  .modal label { font-size: 12px; font-weight: 600; color: #94a3b8; display: block; margin-bottom: 4px; margin-top: 12px; }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #1e293b;
    background: #0f172a; color: #e2e8f0; font-size: 13px; outline: none;
    transition: border-color 0.2s;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: #10b981; }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .modal .modal-actions .btn { padding: 8px 18px; }

  #app-content .page { display: none; }
  #app-content .page.active { display: block; }

  .tab-bar { display: flex; gap: 2px; background: #0f0f18; border-radius: 10px; padding: 3px; margin-bottom: 16px; }
  .tab-bar button {
    padding: 6px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600;
    background: transparent; color: #64748b; cursor: pointer; transition: all 0.15s;
  }
  .tab-bar button.active { background: #1e293b; color: #e2e8f0; }
  .tab-bar button:hover:not(.active) { color: #94a3b8; }

  /* Upload Area */
  .upload-zone {
    border: 2px dashed #1e293b; border-radius: 14px; padding: 32px;
    text-align: center; cursor: pointer; transition: all 0.2s;
    background: #0d0d16;
  }
  .upload-zone:hover, .upload-zone.drag-over { border-color: #10b981; background: rgba(16,185,129,0.05); }
  .upload-zone .icon-upload { font-size: 36px; margin-bottom: 8px; }
  .upload-zone p { font-size: 13px; color: #64748b; margin: 4px 0; }
  .upload-zone .browse-link { color: #10b981; font-weight: 600; cursor: pointer; text-decoration: underline; }
  .upload-progress {
    margin-top: 12px; height: 6px; border-radius: 3px; background: #1e293b;
    overflow: hidden; display: none;
  }
  .upload-progress.active { display: block; }
  .upload-progress .fill {
    height: 100%; background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 3px; transition: width 0.3s;
  }

  /* Manifest JSON View */
  .json-view {
    font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 12px;
    background: #0a0a12; border: 1px solid #1e293b; border-radius: 10px;
    padding: 16px; max-height: 400px; overflow: auto; white-space: pre-wrap;
    word-break: break-all; color: #94a3b8; line-height: 1.5;
  }

  .file-list-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid #16162a; font-size: 13px; transition: background 0.15s;
  }
  .file-list-item:hover { background: rgba(255,255,255,0.02); }
  .file-list-item .icon { font-size: 16px; width: 24px; text-align: center; }
  .file-list-item .name { flex: 1; font-weight: 500; }
  .file-list-item .size { color: #64748b; font-size: 11px; min-width: 60px; text-align: right; }
  .file-list-item .actions { display: flex; gap: 4px; }
</style>
</head>
<body>

<!-- ===== Login Overlay ===== -->
<div id="login-overlay">
  <div class="login-card">
    <div class="logo">🎋</div>
    <h1>Admin Panel</h1>
    <p>Bamboo Backend Verwaltung</p>
    <label>Benutzername</label>
    <input type="text" id="login-user" value="admin" autocomplete="username">
    <label>Passwort</label>
    <input type="password" id="login-pass" value="admin123" autocomplete="current-password">
    <div class="error" id="login-error">Falsche Anmeldedaten</div>
    <button id="login-btn" onclick="login()">Anmelden</button>
  </div>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<!-- ===== App ===== -->
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="icon">🎋</div>
      <div><h2>Bamboo</h2><span>Admin Panel</span></div>
    </div>
    <nav>
      <button class="active" data-page="dashboard" onclick="switchPage('dashboard')">📊 Dashboard</button>
      <button data-page="cosmetics" onclick="switchPage('cosmetics')">✨ Cosmetics</button>
      <button data-page="news" onclick="switchPage('news')">📰 News</button>
      <button data-page="events" onclick="switchPage('events')">📅 Events</button>
      <button data-page="banners" onclick="switchPage('banners')">🖼 Banners</button>
      <button data-page="content" onclick="switchPage('content')">📦 Content</button>
    </nav>
    <div class="user-info">
      <span class="name" id="sidebar-user">admin</span>
      <span class="logout" onclick="logout()">Abmelden</span>
    </div>
  </aside>
  <main class="main">
    <div id="app-content">
      <!-- Dashboard -->
      <div class="page active" id="page-dashboard"></div>
      <!-- Cosmetics -->
      <div class="page" id="page-cosmetics"></div>
      <!-- News -->
      <div class="page" id="page-news"></div>
      <!-- Events -->
      <div class="page" id="page-events"></div>
      <!-- Banners -->
      <div class="page" id="page-banners"></div>
      <!-- Content -->
      <div class="page" id="page-content"></div>
    </div>
  </main>
</div>

<!-- ===== Cosmetic Modal ===== -->
<div class="modal-overlay" id="cosmetic-modal">
  <div class="modal">
    <h2 id="cosmetic-modal-title">Neues Cosmetic</h2>
    <p class="sub" id="cosmetic-modal-sub">Erstelle ein neues kosmetisches Item</p>
    <input type="hidden" id="cosmetic-id">
    <label>Slug (eindeutige ID)</label>
    <input type="text" id="cosmetic-slug" placeholder="z.B. dragon-wing">
    <label>Name</label>
    <input type="text" id="cosmetic-name" placeholder="Dragon Wing">
    <label>Beschreibung</label>
    <textarea id="cosmetic-desc" placeholder="Eine kurze Beschreibung..."></textarea>
    <div class="form-row">
      <div><label>Typ</label><select id="cosmetic-type"><option value="cape">Cape</option><option value="aura">Aura</option><option value="hat">Hat</option><option value="ear">Ears</option><option value="rank">Rank</option><option value="other">Other</option></select></div>
      <div><label>Seltenheit</label><select id="cosmetic-rarity"><option value="common">Common</option><option value="rare">Rare</option><option value="epic">Epic</option><option value="legendary">Legendary</option><option value="mythic">Mythic</option></select></div>
    </div>
    <label>Preview URL (optional)</label>
    <input type="text" id="cosmetic-preview" placeholder="https://...">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('cosmetic-modal')">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveCosmetic()">Speichern</button>
    </div>
  </div>
</div>

<!-- ===== News Modal ===== -->
<div class="modal-overlay" id="news-modal">
  <div class="modal">
    <h2 id="news-modal-title">Neuer News-Eintrag</h2>
    <p class="sub" id="news-modal-sub">Erstelle einen neuen News-Artikel</p>
    <input type="hidden" id="news-id">
    <label>Titel</label>
    <input type="text" id="news-title" placeholder="News Titel">
    <label>Untertitel</label>
    <input type="text" id="news-subtitle" placeholder="Optionaler Untertitel">
    <label>Inhalt</label>
    <textarea id="news-content" placeholder="Artikelinhalt..." style="min-height:120px"></textarea>
    <div class="form-row">
      <div><label>Kategorie</label><input type="text" id="news-category" placeholder="general" value="general"></div>
      <div><label>Banner URL</label><input type="text" id="news-banner" placeholder="https://..."></div>
    </div>
    <div class="form-row">
      <div><label>Veröffentlicht am</label><input type="datetime-local" id="news-published"></div>
      <div><label>Game Version</label><input type="text" id="news-version" placeholder="z.B. 1.21"></div>
    </div>
    <div style="display:flex;gap:16px;margin-top:12px">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#94a3b8;font-weight:400">
        <input type="checkbox" id="news-visible" checked> Sichtbar
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#94a3b8;font-weight:400">
        <input type="checkbox" id="news-pinned"> Angepinnt
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('news-modal')">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveNews()">Speichern</button>
    </div>
  </div>
</div>

<!-- ===== Events Modal ===== -->
<div class="modal-overlay" id="events-modal">
  <div class="modal">
    <h2 id="events-modal-title">Neues Event</h2>
    <p class="sub" id="events-modal-sub">Erstelle ein neues Event</p>
    <input type="hidden" id="event-id">
    <label>Titel</label>
    <input type="text" id="event-title" placeholder="Event Titel">
    <label>Untertitel</label>
    <input type="text" id="event-subtitle" placeholder="Optionaler Untertitel">
    <label>Beschreibung</label>
    <textarea id="event-desc" placeholder="Eventbeschreibung..." style="min-height:80px"></textarea>
    <div class="form-row">
      <div><label>Kategorie</label><input type="text" id="event-category" placeholder="general" value="general"></div>
      <div><label>Banner URL</label><input type="text" id="event-banner" placeholder="https://..."></div>
    </div>
    <div class="form-row">
      <div><label>Startdatum</label><input type="datetime-local" id="event-start"></div>
      <div><label>Enddatum</label><input type="datetime-local" id="event-end"></div>
    </div>
    <div class="form-row">
      <div><label>Priorität</label><input type="number" id="event-priority" value="0" min="0"></div>
      <div><label>Autor</label><input type="text" id="event-author" placeholder="Bamboo Team" value="Bamboo Team"></div>
    </div>
    <div style="display:flex;gap:16px;margin-top:12px">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#94a3b8;font-weight:400">
        <input type="checkbox" id="event-active" checked> Aktiv
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#94a3b8;font-weight:400">
        <input type="checkbox" id="event-visible" checked> Sichtbar
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('events-modal')">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveEvent()">Speichern</button>
    </div>
  </div>
</div>

<!-- ===== Banners Modal ===== -->
<div class="modal-overlay" id="banners-modal">
  <div class="modal">
    <h2 id="banners-modal-title">Neues Banner</h2>
    <p class="sub" id="banners-modal-sub">Erstelle ein neues Banner</p>
    <input type="hidden" id="banner-id">
    <label>Titel</label>
    <input type="text" id="banner-title" placeholder="Banner Titel">
    <label>Bild URL</label>
    <input type="text" id="banner-image" placeholder="https://...">
    <label>Beschreibung</label>
    <textarea id="banner-desc" placeholder="Kurze Beschreibung..." style="min-height:60px"></textarea>
    <div class="form-row">
      <div><label>Link-Ziel</label><input type="text" id="banner-target" placeholder="https://..."></div>

<script>
const API = '';

let token = localStorage.getItem('bamboo_admin_token') || '';
let user = JSON.parse(localStorage.getItem('bamboo_admin_user') || 'null');
let cosmeticsCache = [];

// ===== Auth =====
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function login() {
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  const username = document.getElementById('login-user').value;
  const password = document.getElementById('login-pass').value;
  btn.disabled = true; btn.textContent = 'Anmelden...'; err.style.display = 'none';
  try {
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    token = data.data.token;
    user = data.data.user;
    localStorage.setItem('bamboo_admin_token', token);
    localStorage.setItem('bamboo_admin_user', JSON.stringify(user));
    document.getElementById('login-overlay').classList.add('hidden');
    document.getElementById('app').classList.add('active');
    document.getElementById('sidebar-user').textContent = user.displayName || user.username;
    init();
  } catch(e) {
    err.textContent = e.message || 'Anmeldung fehlgeschlagen';
    err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Anmelden';
}

function logout() {
  token = ''; user = null;
  localStorage.removeItem('bamboo_admin_token');
  localStorage.removeItem('bamboo_admin_user');
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-overlay').classList.remove('hidden');
}

// Check saved session
if (token && user) {
  (async () => {
    try {
      const res = await fetch(API + '/api/auth/verify', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      if (data.success) {
        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('app').classList.add('active');
        document.getElementById('sidebar-user').textContent = user.displayName || user.username;
        init();
        return;
      }
    } catch {}
    token = ''; user = null;
    localStorage.removeItem('bamboo_admin_token');
    localStorage.removeItem('bamboo_admin_user');
  })();
}

// ===== Navigation =====
function switchPage(page) {
  document.querySelectorAll('.sidebar nav button').forEach(b => b.classList.remove('active'));
  document.querySelector(`.sidebar nav button[data-page="${page}"]`).classList.add('active');
  document.querySelectorAll('#app-content .page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  if (page === 'dashboard') renderDashboard();
  else if (page === 'cosmetics') renderCosmetics();
  else if (page === 'news') renderNews();
  else if (page === 'events') renderEvents();
  else if (page === 'banners') renderBanners();
  else if (page === 'content') renderContent();
}

// ===== API Helper =====
async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...opts.headers }
  });
  if (res.status === 401) { logout(); throw new Error('Session abgelaufen'); }
  return res.json();
}

// ===== Init =====
async function init() {
  renderDashboard();
}

// ===== Dashboard =====
async function renderDashboard() {
  const el = document.getElementById('page-dashboard');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const [cosRes, healthRes, repoRes] = await Promise.all([
      api('/api/cosmetics?limit=1'),
      fetch(API + '/api/health').then(r => r.json()).catch(() => ({})),
      fetch(API + '/api/content/repo-status', { headers: { 'Authorization': 'Bearer ' + token } }).then(r => r.json()).catch(() => ({}))
    ]);
    const totalCos = cosRes.total || 0;
    const repo = repoRes.data || {};
    const manifest = repo.manifest || {};
    const git = repo.git || {};
    el.innerHTML = `
      <div class="page-header"><h1>Dashboard</h1><p>Übersicht über das Bamboo Backend</p></div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-value">${totalCos}</div><div class="stat-label">✨ Cosmetics</div></div>
        <div class="stat-card"><div class="stat-value">${manifest.fileCount || '—'}</div><div class="stat-label">📦 Content Files</div></div>
        <div class="stat-card"><div class="stat-value">${manifest.version ? 'v' + manifest.version : '—'}</div><div class="stat-label">📋 Manifest Version</div></div>
        <div class="stat-card"><div class="stat-value">${healthRes.database === 'connected' ? '✅' : '❌'}</div><div class="stat-label">🗄️ PostgreSQL</div></div>
        <div class="stat-card"><div class="stat-value">${healthRes.status === 'ok' ? '✅' : '❌'}</div><div class="stat-label">🖥️ Backend Status</div></div>
        <div class="stat-card"><div class="stat-value">${git.hasUncommittedChanges ? '⚠️' : '✅'}</div><div class="stat-label">📝 Git Status</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="card">
          <div class="card-header"><h3>Letzte Cosmetics</h3><span class="badge">${totalCos} gesamt</span></div>
          <div class="card-body" id="dash-cosmetics-list">${totalCos > 0 ? '<div class="loading"><div class="spinner"></div></div>' : '<div class="empty-state"><p>Keine Cosmetics vorhanden</p></div>'}</div>
        </div>
        <div class="card">
          <div class="card-header"><h3>Content Repo</h3><span class="badge">${git.branch || '—'}</span></div>
          <div class="card-body" style="font-size:13px">
            ${manifest.fileCount ? `
              <div style="margin-bottom:8px">📋 <strong>${manifest.fileCount}</strong> Dateien in Manifest v${manifest.version}</div>
              <div style="margin-bottom:8px">💾 <strong>${formatBytes(manifest.totalSize || 0)}</strong> total</div>
              <div style="margin-bottom:8px">🕐 Zuletzt aktualisiert: <strong>${manifest.updatedAt ? new Date(manifest.updatedAt).toLocaleString() : '—'}</strong></div>
              ${git.lastCommit ? `<div style="margin-bottom:8px">📝 Letzter Commit: <strong style="font-family:monospace;font-size:11px">${git.lastCommit}</strong></div>` : ''}
              ${git.hasUncommittedChanges ? '<div style="color:#f59e0b">⚠️ Nicht committete Änderungen vorhanden</div>' : '<div style="color:#10b981">✅ Alles synchronisiert</div>'}
            ` : '<div class="empty-state"><p>Keine Content-Daten verfügbar</p></div>'}
          </div>
        </div>
      </div>
    `;
    if (totalCos > 0) {
      const full = await api('/api/cosmetics?limit=5');
      const list = document.getElementById('dash-cosmetics-list');
      if (full.data && full.data.length > 0) {
        list.innerHTML = full.data.map(c => `
          <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #16162a">
            <span class="badge-type ${c.type}">${c.type}</span>
            <span style="flex:1;font-weight:600">${c.name}</span>
            <span class="badge-rarity ${c.rarity}">${c.rarity}</span>
            <span class="status-dot ${c.isActive ? 'active' : 'inactive'}"></span>
          </div>
        `).join('');
      }
    }
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>⚠️ ${e.message}</p></div>`;
  }
}

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(1024));
  return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}

    await api('/api/events/' + id, { method: 'DELETE' });
    showToast('Event gelöscht', 'success');

}

// ===== Banners =====
let bannersCache = [];

async function renderBanners() {
  const el = document.getElementById('page-banners');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const data = await api('/api/banners');
    bannersCache = data.data || [];
    el.innerHTML = `
      <div class="page-header" style="display:flex;align-items:center;justify-content:space-between">
        <div><h1>🖼 Banners</h1><p>${bannersCache.length} Banner(s)</p></div>
        <button class="btn btn-primary" onclick="openBannerModal()">+ Neu</button>
      </div>
      <div class="card"><div class="card-body">
        ${bannersCache.length === 0 ? '<div class="empty-state"><p>Keine Banners vorhanden</p></div>' : `
        <table>
          <thead><tr><th>Titel</th><th>Vorschau</th><th>Sortierung</th><th>Status</th><th>Aktionen</th></tr></thead>
          <tbody>
            ${bannersCache.map(b => `
              <tr>
                <td style="font-weight:600">${b.title}</td>
                <td>${b.imageUrl ? '<img src="'+b.imageUrl+'" style="height:36px;border-radius:6px;object-fit:cover" onerror="this.style.display=\'none\'">' : '<span style="color:#64748b">—</span>'}</td>
                <td style="color:#64748b;font-size:12px">${b.sortOrder || 0}</td>
                <td><span class="status-dot ${b.isActive ? 'active' : 'inactive'}"></span>${b.isActive ? 'Aktiv' : 'Inaktiv'}</td>
                <td>
                  <button class="btn btn-ghost btn-sm" onclick="editBanner('${b.id}')">✏️</button>
                  <button class="btn btn-sm ${b.isActive ? 'btn-ghost' : 'btn-primary'}" onclick="toggleBanner('${b.id}')">${b.isActive ? 'Deaktiv.' : 'Aktivieren'}</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteBanner('${b.id}')">🗑️</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>`}
      </div></div>
    `;
  } catch(e) { el.innerHTML = `<div class="empty-state"><p>⚠️ ${e.message}</p></div>`; }
}

function openBannerModal(item) {
  document.getElementById('banners-modal-title').textContent = item ? 'Banner bearbeiten' : 'Neues Banner';
  document.getElementById('banners-modal-sub').textContent = item ? 'Bearbeite das Banner' : 'Erstelle ein neues Banner';
  document.getElementById('banner-id').value = item ? item.id : '';
  document.getElementById('banner-title').value = item ? item.title : '';
  document.getElementById('banner-image').value = item ? item.imageUrl : '';
  document.getElementById('banner-desc').value = item ? item.description : '';
  document.getElementById('banner-target').value = item ? item.clickTarget : '';
  document.getElementById('banner-clicktype').value = item ? item.clickType : 'external';
  document.getElementById('banner-sort').value = item ? item.sortOrder : 0;
  document.getElementById('banner-priority').value = item ? item.priority : 0;
  document.getElementById('banner-active').checked = item ? item.isActive : true;
  document.getElementById('banners-modal').classList.add('open');
}

function editBanner(id) {
  const item = bannersCache.find(b => b.id === id);
  if (item) openBannerModal(item);
}

async function saveBanner() {
  const id = document.getElementById('banner-id').value;
  const body = {
    title: document.getElementById('banner-title').value,
    imageUrl: document.getElementById('banner-image').value,
    description: document.getElementById('banner-desc').value,
    clickTarget: document.getElementById('banner-target').value,
    clickType: document.getElementById('banner-clicktype').value,
    sortOrder: parseInt(document.getElementById('banner-sort').value) || 0,
    priority: parseInt(document.getElementById('banner-priority').value) || 0,
    isActive: document.getElementById('banner-active').checked,
  };
  if (!body.title) { showToast('Titel ist erforderlich', 'error'); return; }
  if (!body.imageUrl) { showToast('Bild-URL ist erforderlich', 'error'); return; }
  try {
    if (id) {
      await api('/api/banners/' + id, { method: 'PUT', body: JSON.stringify(body) });
      showToast('Banner aktualisiert', 'success');
    } else {
      await api('/api/banners', { method: 'POST', body: JSON.stringify(body) });
      showToast('Banner erstellt', 'success');
    }
    closeModal('banners-modal');
    renderBanners();
  } catch(e) { showToast('Fehler: ' + e.message, 'error'); }
}

async function toggleBanner(id) {
  try {
    await api('/api/banners/' + id + '/toggle', { method: 'PATCH' });
    showToast('Status geändert', 'success');
    renderBanners();
  } catch(e) { showToast('Fehler: ' + e.message, 'error'); }
}

async function deleteBanner(id) {
  if (!confirm('Dieses Banner wirklich löschen?')) return;
  try {
    await api('/api/banners/' + id, { method: 'DELETE' });
    showToast('Banner gelöscht', 'success');
    renderBanners();
  } catch(e) { showToast('Fehler: ' + e.message, 'error'); }
}

// ===== Content Management =====
let contentRepoData = null;
let contentBrowsePath = '';

async function renderContent() {
  const el = document.getElementById('page-content');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  try {
    const [repoRes, dbStatusRes] = await Promise.all([
      fetch(API + '/api/content/repo-status', { headers: { 'Authorization': 'Bearer ' + token } }).then(r => r.json()),
      api('/api/content/status').catch(() => ({}))
    ]);
    contentRepoData = repoRes.data || {};
    const manifest = contentRepoData.manifest || {};
    const git = contentRepoData.git || {};
    const dirTree = contentRepoData.directoryTree || {};
    const dbStatus = dbStatusRes || {};

    const categories = Object.keys(dirTree).sort();
    const totalFiles = Object.values(dirTree).reduce((sum, v) => sum + (v.files || 0) + (v.subdirs || 0), 0);

    const uploadCategories = [
      { value: 'cosmetics', label: '✨ Cosmetics' },
      { value: 'themes', label: '🎨 Themes' },
      { value: 'banners', label: '🖼 Banners' },
      { value: 'news', label: '📰 News' },
      { value: 'events', label: '📅 Events' },
      { value: 'assets', label: '🧩 Assets' },
      { value: 'textures', label: '🖌 Textures' },
      { value: 'Blockbench Models', label: '🧊 Blockbench' },
      { value: 'cosmetic_models', label: '👤 Cosmetic Models' },
    ];

    el.innerHTML = `
      <div class="page-header" style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <h1>📦 Content Management</h1>
          <p>Asset Repository: <code style="font-size:11px;color:#10b981">${contentRepoData.repoPath || '—'}</code></p>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-value">${manifest.fileCount || 0}</div>
          <div class="stat-label">📋 Manifest Files</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">v${manifest.version || '—'}</div>
          <div class="stat-label">🏷 Manifest Version</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${formatBytes(manifest.totalSize || 0)}</div>
          <div class="stat-label">💾 Total Size</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${categories.length}</div>
          <div class="stat-label">📁 Categories</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${git.hasUncommittedChanges ? '⚠️' : '✅'}</div>
          <div class="stat-label">📝 Git Status</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${dbStatus.totalFiles || '—'}</div>
          <div class="stat-label">🗄️ DB Files</div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="generateManifest()" id="btn-gen-manifest">🔄 Manifest generieren</button>
        <button class="btn btn-primary" style="background:#6366f1" onclick="gitPush()" id="btn-git-push">📤 Git Push</button>
        <button class="btn btn-ghost" onclick="refreshContent()">🔄 Refresh</button>
        ${git.hasUncommittedChanges ? '<span style="color:#f59e0b;font-size:12px;display:flex;align-items:center;gap:4px">⚠️ ' + (git.changedFiles || 0) + ' uncommittete Änderungen</span>' : ''}
        ${git.lastCommit ? '<span style="color:#64748b;font-size:11px;display:flex;align-items:center">📝 ' + git.lastCommit + '</span>' : ''}
      </div>

      <!-- File Upload -->
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><h3>📤 Dateien hochladen</h3></div>
        <div class="card-body">
          <div style="margin-bottom:12px;display:flex;align-items:center;gap:12px">
            <label style="font-size:13px;font-weight:600;color:#94a3b8">Kategorie:</label>
            <select id="upload-category" style="padding:6px 12px;border-radius:8px;border:1px solid #1e293b;background:#0f172a;color:#e2e8f0;font-size:13px">
              ${uploadCategories.map(c => `<option value="${c.value}">${c.label}</option>`).join('')}
            </select>
            <label style="font-size:13px;font-weight:600;color:#94a3b8;margin-left:8px">oder neuer Ordner:</label>
            <input type="text" id="upload-category-custom" placeholder="custom-folder" style="padding:6px 12px;border-radius:8px;border:1px solid #1e293b;background:#0f172a;color:#e2e8f0;font-size:13px;width:150px">
          </div>
          <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
            <div class="icon-upload">📁</div>
            <p><strong>Klicke zum Auswählen</strong> oder ziehe Dateien hierher</p>
            <p>Max. 100MB pro Datei</p>
            <div class="upload-progress" id="upload-progress"><div class="fill" id="upload-progress-fill"></div></div>
          </div>
          <input type="file" id="file-input" multiple style="display:none" onchange="handleFileSelect(event)">
          <div id="upload-status" style="margin-top:8px;font-size:12px;color:#64748b"></div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <!-- File Browser -->
        <div class="card">
          <div class="card-header">
            <h3>📂 Dateien</h3>
            <span class="badge">${totalFiles} items</span>
          </div>
          <div class="card-body" style="max-height:400px;overflow-y:auto;padding:0">
            ${categories.length === 0 ? '<div class="empty-state"><p>Keine Dateien gefunden</p></div>' :
              categories.map(cat => {
                const info = dirTree[cat];
                return `
                  <div class="file-list-item">
                    <span class="icon">${info.type === 'directory' ? '📁' : '📄'}</span>
                    <span class="name">${cat}${info.type === 'file' ? '' : '/'}</span>
                    <span class="size">${info.type === 'directory' ? (info.files || 0) + ' files' : formatBytes(info.size || 0)}</span>
                    <span class="actions">
                      ${info.type === 'file'
                        ? `<button class="btn btn-danger btn-sm" onclick="deleteContentFile('${cat}')" title="Löschen">🗑️</button>`
                        : ''}
                    </span>
                  </div>
                `;
              }).join('')
            }
          </div>
        </div>

        <!-- Manifest Preview -->
        <div class="card">
          <div class="card-header"><h3>📋 Manifest.json</h3><span class="badge">v${manifest.version || '—'}</span></div>
          <div class="card-body" style="padding:0">
            <div class="json-view" id="manifest-preview">${manifest.fileCount
              ? JSON.stringify({ schemaVersion: manifest.schemaVersion, version: manifest.version, updatedAt: manifest.updatedAt, fileCount: manifest.fileCount, totalSize: manifest.totalSize }, null, 2)
              : '// Kein Manifest vorhanden\n// Klicke "Manifest generieren"'}</div>
          </div>
        </div>
      </div>
    `;

    // Setup drag & drop
    setupUploadZone();
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>⚠️ ${e.message}</p></div>`;
  }
}

function setupUploadZone() {
  const zone = document.getElementById('upload-zone');
  if (!zone) return;

  ['dragenter', 'dragover'].forEach(evt => {
    zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
  });
  ['dragleave', 'drop'].forEach(evt => {
    zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.remove('drag-over'); });
  });

  zone.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files.length > 0) uploadFiles(files);
  });
}

function handleFileSelect(event) {
  const files = event.target.files;
  if (files.length > 0) uploadFiles(files);
  event.target.value = '';
}

async function uploadFiles(fileList) {
  const category = (document.getElementById('upload-category-custom')?.value?.trim())
    || document.getElementById('upload-category')?.value
    || 'assets';

  const progressFill = document.getElementById('upload-progress-fill');
  const progressBar = document.getElementById('upload-progress');
  const statusEl = document.getElementById('upload-status');

  progressBar.classList.add('active');
  progressFill.style.width = '0%';
  statusEl.textContent = `Lade ${fileList.length} Datei(en) hoch...`;

  const formData = new FormData();
  formData.append('category', category);
  for (const f of fileList) {
    formData.append(fileList.length === 1 ? 'file' : 'files', f);
  }

  const endpoint = fileList.length === 1 ? '/api/content/upload' : '/api/content/upload-multiple';

  try {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', API + endpoint);
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        progressFill.style.width = pct + '%';
      }
    };

    await new Promise((resolve, reject) => {
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText));
        else reject(new Error(xhr.responseText));
      };
      xhr.onerror = () => reject(new Error('Network error'));
      xhr.send(formData);
    });

    progressFill.style.width = '100%';
    const count = fileList.length;
    statusEl.innerHTML = `<span style="color:#10b981">✅ ${count} Datei(en) erfolgreich hochgeladen in "${category}/"</span>`;
    showToast(`${count} Datei(en) hochgeladen`, 'success');

    // Refresh after short delay
    setTimeout(() => renderContent(), 1500);
  } catch(e) {
    statusEl.innerHTML = `<span style="color:#ef4444">❌ Upload fehlgeschlagen: ${e.message}</span>`;
    showToast('Upload fehlgeschlagen', 'error');
  } finally {
    setTimeout(() => progressBar.classList.remove('active'), 1000);
  }
}

async function generateManifest() {
  const btn = document.getElementById('btn-gen-manifest');
  btn.disabled = true; btn.textContent = '⏳ Generiere...';
  try {
    const res = await fetch(API + '/api/content/generate-manifest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({})
    });
    const data = await res.json();
    if (data.success) {
      showToast(`Manifest v${data.manifest?.version || '?'} generiert (${data.manifest?.files?.length || 0} Dateien)`, 'success');
      setTimeout(() => renderContent(), 500);
    } else {
      showToast('Fehler: ' + (data.error || 'Unknown'), 'error');
    }
  } catch(e) {
    showToast('Fehler: ' + e.message, 'error');
  }
  btn.disabled = false; btn.textContent = '🔄 Manifest generieren';
}

async function gitPush() {
  const message = prompt('Commit-Nachricht:', 'Update content from admin panel');
  if (!message) return;

  const btn = document.getElementById('btn-git-push');
  btn.disabled = true; btn.textContent = '⏳ Pushing...';
  try {
    const res = await fetch(API + '/api/content/git-push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ message })
    });
    const data = await res.json();
    if (data.success) {
      showToast(data.message || 'Git push erfolgreich', 'success');
      setTimeout(() => renderContent(), 500);
    } else {
      showToast('Fehler: ' + (data.error || 'Unknown'), 'error');
    }
  } catch(e) {
    showToast('Fehler: ' + e.message, 'error');
  }
  btn.disabled = false; btn.textContent = '📤 Git Push';
}

async function deleteContentFile(filePath) {
  if (!confirm(`Datei "${filePath}" wirklich löschen?`)) return;
  try {
    const res = await fetch(API + '/api/content/file', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ path: filePath })
    });
    const data = await res.json();
    if (data.success) {
      showToast('Datei gelöscht', 'success');
      renderContent();
    } else {
      showToast('Fehler: ' + (data.error || 'Unknown'), 'error');
    }
  } catch(e) {
    showToast('Fehler: ' + e.message, 'error');
  }
}

function refreshContent() {
  renderContent();
}
