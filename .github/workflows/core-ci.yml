name: core-ci

on:
  push:
  pull_request:
  # Allows the first real run without a code change (GitHub UI -> Run workflow).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # No Electron binary and no server install: the core suite must run from
      # fixtures alone. A live Minecraft installation is never required.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Core suite with external network blocked
        run: npm run test:offline
      - name: Support bundle redaction E2E (offline)
        run: node scripts/support-bundle-e2e.cjs
      - name: Production build
        run: npm run build
