name: Release

# Baut die Installer für Windows, macOS und Linux und hängt sie an das Release
# des gepushten Tags. Der letzte Job schreibt `latest.json` aus allen
# hochgeladenen Artefakten, damit der Updater jede Plattform bedient.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, der gebaut und veröffentlicht wird (z. B. v0.2.5)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ''
            bundle: target/release/bundle
            arch: ''
          # Zwei Architektur-Builds statt eines Universal-Builds: der Universal-
          # Build verschmilzt nur die Haupt-Binary, der Bundler erwartet aber
          # auch die CLI und bricht ab. Getrennt gebaut entstehen zwei DMGs.
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
            bundle: target/aarch64-apple-darwin/release/bundle
            arch: aarch64
          - name: macOS (Intel)
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            bundle: target/x86_64-apple-darwin/release/bundle
            arch: x64
          - name: Linux
            platform: ubuntu-24.04
            args: ''
            bundle: target/release/bundle
            arch: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: macOS-Ziele
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-24.04'
        timeout-minutes: 20
        run: |
          # Die Runner-Quellen zeigen per mirror+file: auf einen toten Azure-Mirror
          # und fuer noble-updates teils auf security.ubuntu.com, wo die Dateien
          # 404 liefern. Statt zu patchen: eine saubere Quelle, ein Host.
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get clean
          for i in 1 2 3; do
            timeout 180 sudo -E apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::Retries=1 update && break
            sleep 5
          done
          timeout 600 sudo -E apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::Retries=2 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm --prefix ui ci

      - name: Bauen und signieren
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm --prefix ui run tauri -- build ${{ matrix.args }}

      - name: Release anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./tauri.conf.json').version")
          notes="docs/release-notes/v$version.md"
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          if [ -f "$notes" ]; then
            gh release create "$TAG" --title "Bamboo Launcher $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --title "Bamboo Launcher $TAG" --generate-notes
          fi

      - name: Pakete hochladen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Tauri nennt das macOS-Update-Paket für beide Architekturen gleich; ohne
          # Architektur im Namen überschreibt der zweite Build den ersten und der
          # Updater bekommt nur eine Plattform.
          if [ -n '${{ matrix.arch }}' ]; then
            version=$(node -p "require('./tauri.conf.json').version")
            for file in '${{ matrix.bundle }}'/macos/*.app.tar.gz*; do
              [ -e "$file" ] || continue
              base=$(basename "$file")
              mv "$file" "$(dirname "$file")/${base/Bamboo Launcher/Bamboo.Launcher_${version}_${{ matrix.arch }}}"
            done
          fi

          # bash 3.2 auf macOS kennt kein mapfile, und Dateinamen enthalten Leerzeichen.
          count=0
          while IFS= read -r -d '' file; do
            gh release upload "$TAG" "$file" --clobber
            count=$((count + 1))
          done < <(find '${{ matrix.bundle }}' -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) -print0)
          echo "$count Dateien hochgeladen"

  feed:
    name: latest.json
    needs: build
    # Auch wenn eine Plattform scheitert: Windows und macOS sollen ihren Feed
    # bekommen, statt dass der ganze Release ohne latest.json dasteht.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Feed aus den Release-Dateien bauen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./tauri.conf.json').version")
          folder="release/v$version"
          mkdir -p "$folder"
          gh release download "$TAG" --dir "$folder" --clobber
          gh release view "$TAG" --json body -q .body > "$folder/RELEASE_NOTES.md"
          node scripts/make-latest-json.mjs \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --dir "$folder"
          node -e "
            const feed = require('./$folder/latest.json')
            const need = ['windows-x86_64', 'darwin-aarch64', 'darwin-x86_64', 'linux-x86_64']
            const missing = need.filter((key) => !feed.platforms[key])
            if (missing.length) console.warn('Fehlende Plattformen im Feed: ' + missing.join(', '))
          "
          gh release upload "$TAG" "$folder/latest.json" --clobber

      # Der Legacy-Feed gibt alten Electron-Builds (0.2.4 und älter) den
      # nativen Update-Dialog, den sie schon kennen: sie laden das Rust-Paket
      # und starten den Installer beim Neustart.
      - name: Electron-Feed bauen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./tauri.conf.json').version")
          folder="release/v$version"
          node scripts/make-legacy-update-yml.mjs --dir "$folder"
          for feed in latest.yml latest-linux.yml; do
            if [ -f "$folder/$feed" ]; then
              gh release upload "$TAG" "$folder/$feed" --clobber
            fi
          done

      - name: Prüfsummen schreiben
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./tauri.conf.json').version")
          folder="release/v$version"
          # Feed und Notizen gehören nicht in die Liste, und die alten
          # Prüfsummen würden sich selbst mit einrechnen.
          rm -f "$folder/SHA256SUMS.txt" "$folder/latest.json" "$folder/RELEASE_NOTES.md"
          # Die Liste selbst steht nicht in der Liste, sonst prüft sha256sum -c sie
          # gegen den Hash der leeren Datei und meldet einen Fehler.
          ( cd "$folder" && find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS.txt )
          gh release upload "$TAG" "$folder/SHA256SUMS.txt" --clobber
