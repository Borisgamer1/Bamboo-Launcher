name: Release

# Baut die Installer für Windows, macOS und Linux und hängt sie an das Release
# des gepushten Tags. Der letzte Job schreibt `latest.json` aus allen
# hochgeladenen Artefakten, damit der Updater jede Plattform bedient.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, der gebaut und veröffentlicht wird (z. B. v0.2.5)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ''
            bundle: target/release/bundle
          # Zwei Architektur-Builds statt eines Universal-Builds: der Universal-
          # Build verschmilzt nur die Haupt-Binary, der Bundler erwartet aber
          # auch die CLI und bricht ab. Getrennt gebaut entstehen zwei DMGs.
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
            bundle: target/aarch64-apple-darwin/release/bundle
          - name: macOS (Intel)
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            bundle: target/x86_64-apple-darwin/release/bundle
          - name: Linux
            platform: ubuntu-22.04
            args: ''
            bundle: target/release/bundle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: macOS-Ziele
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm --prefix ui ci

      - name: Bauen und signieren
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm --prefix ui run tauri -- build ${{ matrix.args }}

      - name: Release anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "Bamboo Launcher $TAG" --generate-notes

      - name: Pakete hochladen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mapfile -t files < <(find '${{ matrix.bundle }}' -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \))
          printf 'Hochgeladen: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  feed:
    name: latest.json
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Feed aus den Release-Dateien bauen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./tauri.conf.json').version")
          folder="release/v$version"
          mkdir -p "$folder"
          gh release download "$TAG" --dir "$folder" --clobber
          gh release view "$TAG" --json body -q .body > "$folder/RELEASE_NOTES.md"
          node scripts/make-latest-json.mjs \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --dir "$folder"
          gh release upload "$TAG" "$folder/latest.json" --clobber
