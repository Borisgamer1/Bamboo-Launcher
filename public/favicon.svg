<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bamboo-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="128" height="128" rx="32" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="4" />

  <!-- Stylized Bamboo Shoot -->
  <g transform="translate(14, 14)" filter="url(#glow)">
    <!-- Main stem bottom segment -->
    <path d="M 40 85 L 56 85 L 54 62 L 42 62 Z" fill="url(#bamboo-grad)" />
    <!-- Segment joint -->
    <rect x="40" y="59" width="16" height="3" rx="1.5" fill="#86efac" />
    
    <!-- Middle segment -->
    <path d="M 43 56 L 53 56 L 51 34 L 45 34 Z" fill="url(#bamboo-grad)" />
    <!-- Segment joint -->
    <rect x="43" y="31" width="10" height="3" rx="1.5" fill="#86efac" />
    
    <!-- Top segment -->
    <path d="M 45 28 L 51 28 L 49 12 L 47 12 Z" fill="url(#bamboo-grad)" />

    <!-- Left Leaf -->
    <path d="M 41 60 C 25 55, 18 40, 20 30 C 28 35, 36 48, 42 58 Z" fill="url(#bamboo-grad)" />
    <!-- Right Leaf -->
    <path d="M 55 33 C 70 30, 78 18, 76 8 C 68 12, 60 22, 53 31 Z" fill="url(#bamboo-grad)" />
    <!-- Small Left Leaf -->
    <path d="M 44 33 C 32 30, 28 20, 29 12 C 35 16, 40 24, 44 31 Z" fill="url(#bamboo-grad)" />
  </g>
</svg>
