<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      border-radius: 12px;
    }
    .splash-logo {
      width: 720px;
      height: 720px;
      object-fit: contain;
      animation: splashFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes splashFadeIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <img src="resources/SystemIcons/LauncherThin.png" alt="Bamboo Launcher" class="splash-logo">
</body>
</html>
